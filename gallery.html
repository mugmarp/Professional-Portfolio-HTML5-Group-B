<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            /* tint the top bar so it reads as its own band instead of
               floating on the same white as everything else */
            background: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
        }

        .logo {
            display: inline-flex;
            flex-direction: column;
            text-decoration: none;
            font-weight: bold;
        }

        .logo span {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.7;
        }

        .logo p {
            font-size: 1.25rem;
            margin: 0;
            line-height: 1.2;

        }

        .logo a {
            text-decoration: none;
            color: rgb(47, 47, 47);
        }

        .logo .subtitle {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.7;
        }

        span.p {
            font-family: 'Courier New', Courier, monospace;

        }

        #main_nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
            align-content: center;
        }

        #main_nav a {
            text-decoration: none;
            color: inherit;
        }

        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        footer {
            border-top: 1px solid #d0d7de;
            margin-top: 2rem;
            padding-top: 1rem;
            font-size: 0.9rem;
            color: #555;
        }

        figure {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        figure img {
            flex-shrink: 0;
        }

        figcaption {
            flex: 1;
        }
        /* colour pass: links were falling back to the browser default blue,
           which didn't match anything else on the page. every value here was
           checked for contrast against the background it sits on. */
        /* scoped to main on purpose - the logo link and the nav links each set
           their own colour at higher specificity, so a bare "a" rule would just
           get overridden by them and quietly do nothing. */
        main a {
            color: #0969da;
        }

        main a:hover {
            color: #0550ae;
            text-decoration: underline;
        }

        /* the nav links inherit their colour from an id-specificity rule, so the
           hover above never reaches them and the menu would give no feedback. */
        #main_nav a:hover {
            color: #0969da;
            text-decoration: underline;
        }

        /* keyboard users need to see where they are. the browser's default
           outline disappears against the tinted header. */
        :focus-visible {
            outline: 3px solid #0969da;
            outline-offset: 2px;
        }

    </style>
</head>

<body>
    <header>
        <div class="logo">

            <a href="index.html">
                <p>
                    MARK PAUL
                    <br><span class="subtitle">Portfolio</span>
                </p>
            </a>
        </div>

        <nav id="main_nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="data.html">Data</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <hr>
        <!-- aria-labelledby points at the h2 below so this section gets announced by name
             instead of just "region". -->
        <section aria-labelledby="gallery-heading">
            <h2 id="gallery-heading">Selected Work</h2>

            <!-- figure instead of a bare <img>, because the caption belongs to the image and
                 should travel with it. the alt text says what's actually in the shot - if it just
                 said "screenshot" it would tell someone who can't see it absolutely nothing. -->

            <figure>
                <img src="media/images/xfce4_Debian_proot.png" width="800"
                    alt="Screenshot of Termux X11 running Debian Linux with the XFCE4 desktop environment as a GUI on Android, with the floating green keyboard button-toggle visible on the right hand side of the screen.">
                <figcaption>
                    <strong>Termux X11 Floating Keyboard Button</strong> &mdash; an extra feature
                    for adding an on-demand soft keyboard by just tapping Termux X11 app on Android.
                    Built with C, Android NDK, X11, and Termux.
                </figcaption>
            </figure>

            <figure>
                <img width="300" src="media/images/Timetable_screen.png"
                    alt="Screenshot of the Lectures Android app showing a seven-day timetable with lecture blocks and a vacant room finder panel.">
                <figcaption>
                    <strong>Lectures App</strong> : Android timetable app with a
                    write-through offline cache, find free room and queued sync. Currently shipping as a native Android
                    academic companion for a MUST student (it started out as a personal app),
                    built with Kotlin and Jetpack Compose M3.
                </figcaption>
            </figure>
            <figure>
                <img width="300" src="media/images/faculty_picker_lectures_app.png"
                    alt="Screenshot of the Lectures Android app showing the Faculty picker.">
                <figcaption>
                    <strong>In the Lectures App</strong>, one will first choose their Faculty using the Faculty picker.
                </figcaption>
            </figure>
            <figure>
                <img src="media/images/HampKeyboardSettings.png" width="300"
                    alt="Screenshot of the Hamp Keyboard app settings screen">
                <figcaption>
                    <strong>Hamp Keyboard</strong> is a fork of the FUTO Keyboard (itself a fork of LatinIME, the
                    Android Open-Source Keyboard), and it installs alongside the official FUTO Keyboard app.
                    What makes it special is the spacebar gestures it adds &mdash; swipe left/right moves the
                    cursor character by character, and swipe up/down moves it line by line.
                </figcaption>
            </figure>
        </section>

        <section>
            <h2>Quick Demo showing some screens in Lectures app</h2>
            <!-- youtube embed rather than a local <video>. the title attribute matters more
                 here than usual: an iframe is a black box to a screen reader, so without a real
                 name it just announces "frame". -->
            <iframe width="300" height="533" src="https://www.youtube.com/embed/O3fT4BBkRUM"
                title="Short demo video showing screens from the Lectures app" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write" allowfullscreen>
            </iframe>
        </section>



    </main>

    <footer>
        <p>&copy; 2026 MARK PAUL.</p>
    </footer>

</body>

</html>
